name: deploy-cloudflare

# Deploy the rewrite Worker (infra/worker) to CN Webify Customers. No secrets: a one-hour
# Cloudflare token comes from the CN Webify token broker, which accepts this exact file, on
# `main`, for push and workflow_dispatch. The route
# projects.cristian-nichifor.com/legislation-linter/api/* is bound by CN Webify's Terraform.

on:
  push:
    branches: [main]
    paths:
      - "infra/worker/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # the broker reads this job's GitHub OIDC token

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cloudflare token from the CN Webify broker
        run: |
          set -euo pipefail
          jwt=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://tokens.cnwebify.com" | jq -r .value)
          reply=$(curl -sf -X POST -H "Authorization: Bearer $jwt" https://tokens.cnwebify.com/token)
          token=$(jq -r .token <<<"$reply"); echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=5d5a0c8a05e5d8292065cd0c0cf60291" >> "$GITHUB_ENV"
      - name: Deploy legislation-linter-rewrite
        working-directory: infra/worker
        run: npx --yes wrangler@4 deploy
      - name: Summary
        run: |
          {
            echo "Deployed Worker \`legislation-linter-rewrite\` to CN Webify Customers."
            echo "Endpoint (route bound by CN Webify): https://projects.cristian-nichifor.com/legislation-linter/api/rewrite"
          } >> "$GITHUB_STEP_SUMMARY"
