name: deploy-pages-cloudflare

# Build the in-browser app exactly as pages.yml does and publish it to Cloudflare Pages in
# CN Webify Customers, laid out as on GitHub Pages (`/legislation-linter/`), so the projects hub
# proxies the path 1:1. main is public behind projects.cristian-nichifor.com/legislation-linter/;
# dev is the protected preview behind projects-dev.cristian-nichifor.com, reached only through the
# CN Webify preview gate (ADR-022; functions/_middleware.js refuses everything else). No secrets:
# a one-hour Cloudflare token comes from the CN Webify token broker, which accepts this exact file
# on main and dev. pages.yml (GitHub Pages) stays until the hub proxies Cloudflare Pages.

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - "scripts/**"
      - "sources/**"
      - "functions/**"
      - ".github/workflows/deploy-pages-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # the broker reads this job's GitHub OIDC token

concurrency:
  group: deploy-pages-cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT_NAME: legislation-linter

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Use the dataset release if published, else the committed fixtures
        id: date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The newest dated dataset release, as pages.yml picks it.
          TAG=$(gh release list --limit 100 --json tagName \
            -q '[.[].tagName | select(test("^date-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | reverse | .[0] // ""')
          if [ -n "$TAG" ] && gh release download "$TAG" --pattern date.tar.gz -O date.tar.gz 2>/dev/null; then
            echo "dataset: $TAG"
            mkdir -p web && tar xzf date.tar.gz -C web
            echo "sursa=gata" >> "$GITHUB_OUTPUT"
          else
            echo "sursa=fixturi" >> "$GITHUB_OUTPUT"
            echo "no dataset release yet — building the 4-act fixtures demo"
          fi
      - name: Point the dev build at the dev rewrite Worker
        if: github.ref_name == 'dev'
        # The endpoint is a literal in app/index.html. It is swapped before the build so the
        # service worker's version hash covers it; the swap fails if the literal ever moves.
        run: |
          set -euo pipefail
          prod='https://projects.cristian-nichifor.com/legislation-linter/api/rewrite'
          grep -qF "$prod" app/index.html
          sed -i "s#${prod}#https://projects-dev.cristian-nichifor.com/legislation-linter/api/rewrite#g" app/index.html
          ! grep -qF "$prod" app/index.html
      - name: Build the browser bundle
        # Same data location and slice count as pages.yml; they change together there.
        run: >-
          uv run python -m scripts.construieste_web
          --sursa ${{ steps.date.outputs.sursa }}
          --depozit https://data.cristian-nichifor.com/2026-09-08
          --felii-cautare 8
      - name: Lay out the site as on GitHub Pages
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r web "site/$PROJECT_NAME"
          printf '/ /%s/ 302\n' "$PROJECT_NAME" > site/_redirects
      - name: Refuse files Cloudflare Pages cannot hold
        # Pages rejects any file over 25 MiB (GitHub Pages took up to 100 MB). Name them here
        # rather than let the upload fail midway.
        run: |
          set -euo pipefail
          big=$(find site -type f -size +25M -printf '  %s bytes  %p\n')
          if [ -n "$big" ]; then
            echo "Files over the Cloudflare Pages limit of 25 MiB:"; echo "$big"
            exit 1
          fi
      - name: Cloudflare token from the CN Webify broker
        run: |
          set -euo pipefail
          jwt=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://tokens.cnwebify.com" | jq -r .value)
          reply=$(curl -sf -X POST -H "Authorization: Bearer $jwt" https://tokens.cnwebify.com/token)
          token=$(jq -r .token <<<"$reply"); echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=5d5a0c8a05e5d8292065cd0c0cf60291" >> "$GITHUB_ENV"
      # Created once; the plain pages.dev name may be taken, so Cloudflare can add a suffix.
      - name: Create the Pages project if missing
        run: |
          set -uo pipefail
          if ! out=$(npx --yes wrangler@4.149.0 pages project create "$PROJECT_NAME" --production-branch main 2>&1); then
            grep -qi "already exists" <<<"$out" || { echo "$out"; exit 1; }
            echo "Pages project $PROJECT_NAME already exists."
          fi
      # From the repository root, so the root functions/ (the preview gate) is deployed with it;
      # infra/worker is a separate Worker and is not part of this project.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.149.0 pages deploy site --project-name="$PROJECT_NAME" --branch="$GITHUB_REF_NAME"
      - name: Report the pages.dev hostname
        run: |
          set -euo pipefail
          subdomain=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            | jq -r .result.subdomain)
          {
            echo "Pages project \`$PROJECT_NAME\`: https://$subdomain/$PROJECT_NAME/"
            if [ "$GITHUB_REF_NAME" = dev ]; then
              echo "Preview (sign-in required): https://projects-dev.cristian-nichifor.com/$PROJECT_NAME/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
