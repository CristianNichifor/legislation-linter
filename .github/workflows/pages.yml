name: pages

# The app now lives on Cloudflare Pages (deploy-pages-cloudflare.yml), served at
# https://projects.cristian-nichifor.com/legislation-linter/. What this workflow publishes to
# GitHub Pages is the redirect in redirect/: index.html and 404.html carry the path, query and
# hash across, so every link to cristiannichifor.github.io/legislation-linter/ pasted before the
# move still opens the same place, and sw.js retires the app's old service worker and its caches.
# Nothing is built here.

on:
  push:
    branches: [main]
    paths:
      - "redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A redirect that points at nothing turns a working link into a loop through a 404.
      # Checked here so the stub cannot go live before the site it forwards to.
      - name: Check the destination is live
        run: |
          url=https://projects.cristian-nichifor.com/legislation-linter/
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "destination is not serving; refusing to publish the redirect"; exit 1; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
