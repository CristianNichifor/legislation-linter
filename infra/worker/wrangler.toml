name = "legislation-linter-rewrite"
main = "src/index.js"
compatibility_date = "2025-01-01"
# CN Webify Customers. Pinned so a login or token with access to several accounts cannot deploy
# to the wrong one.
account_id = "5d5a0c8a05e5d8292065cd0c0cf60291"
# Served only on the route projects.cristian-nichifor.com/legislation-linter/api/*, which Terraform
# binds in the CN Webify Customers account; no workers.dev endpoint in production.
workers_dev = false

# The plain-language rewrite cache, KV `legislation-linter-rewrite`, created by Terraform in Customers.
[[kv_namespaces]]
binding = "RESCRIERI"
id = "a15a3a6704fa414696001b94b777f36b"

# Workers AI — Cloudflare's own hosted models. Free within the daily Neuron allocation, no external
# key. The Worker calls it through this binding.
[ai]
binding = "AI"

# Per-IP rate limit (native binding — no KV writes). Tune limit/period to taste.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# Comma-separated allowed Origins for the browser app. Set to your Pages origin to block casual abuse.
#
# localhost is here so the rewrite can be exercised while developing — `construieste_web.py` tells
# you to serve the build on :8080, and without these two entries that page's calls are blocked and
# the feature can only ever be tried on a Pages deploy.
#
# It widens very little. A browser sets `Origin` itself, so a page on evil.com cannot claim to be
# localhost; this admits only pages actually served *from* localhost:8080, which means the
# developer's own machine or someone persuaded to run a local server — a far narrower path than a
# drive-by. Anything outside a browser could forge the header in one line of curl regardless, so
# this list was never the control that matters. Those are the per-IP rate limit and CAP_ZILNIC
# below, both unaffected, and the fact that only PUBLIC law text is ever sent here.
ORIGINI = "https://projects.cristian-nichifor.com,https://cristiannichifor.github.io,http://localhost:8080,http://127.0.0.1:8080"
# Hard ceiling on NEW rewrites per day (a spend cap, in KV). Leave unset to disable.
CAP_ZILNIC = "1500"
# The AI Gateway to route Workers AI calls through, for free caching + analytics (Account
# 5d5a0c8a05e5d8292065cd0c0cf60291 / CN Webify Customers). If this gateway does not exist the Worker falls back
# to Workers AI directly, so it is safe to leave set. Unset to skip the gateway entirely.
AIG_ID = "law-legislation-project-gateway"
# Default Workers AI model; the client may request another from the allowlist in src/index.js.
WAI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# No provider key needed: Workers AI runs on Cloudflare, billed in Neurons (free daily allocation).
# Defences against a runaway bill: the per-IP rate limit, the daily cap, cache-first, the small-input
# rule, the origin allowlist, and the gateway's own rate limit once it exists.

# Protected preview of the dev branch (`wrangler deploy --env dev`), reached only through the
# CN Webify preview gate at projects-dev.cristian-nichifor.com/legislation-linter/api/*; no
# workers.dev or preview URL. Wrangler inherits none of the bindings or vars below into an
# environment, so each is repeated. The cache KV is shared with production, kept apart by
# CHEIE_PREFIX (cache entries and the daily counter), and the rate limit has its own namespace.
[env.dev]
name = "legislation-linter-rewrite-dev"
workers_dev = false
preview_urls = false

[[env.dev.kv_namespaces]]
binding = "RESCRIERI"
id = "a15a3a6704fa414696001b94b777f36b"

[env.dev.ai]
binding = "AI"

[[env.dev.unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[env.dev.vars]
ORIGINI = "https://projects-dev.cristian-nichifor.com,http://localhost:8080,http://127.0.0.1:8080"
CHEIE_PREFIX = "dev/"
# A tighter spend cap than production: the preview is for checking changes, not for traffic.
CAP_ZILNIC = "200"
AIG_ID = "law-legislation-project-gateway"
WAI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
