<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-a mutat — Legislativ</title>
    <link rel="canonical" href="https://projects.cristian-nichifor.com/legislation-linter/" />
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages serves this file for the root and, as 404.html, for every other path, so one
      script covers every link pasted before the move. It carries the path under
      /legislation-linter/, the query and the hash across; the meta refresh is the no-JavaScript
      fallback and can only manage the bare page.
    -->
    <script>
      (function () {
        var target = 'https://projects.cristian-nichifor.com/legislation-linter/';
        var base = '/legislation-linter/';
        var path = location.pathname;
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : '';
        location.replace(target + rest + location.search + location.hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://projects.cristian-nichifor.com/legislation-linter/" />
    </noscript>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0d10;
        color: #e8eaed;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      a {
        color: #7fb3ff;
      }
      p {
        max-width: 32rem;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f8fa;
          color: #14181d;
        }
        a {
          color: #1a5fd0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Legislativ s-a mutat</h1>
      <p>Aplicația este acum pe projects.cristian-nichifor.com. Ar trebui să fii redirecționat imediat.</p>
      <p><a href="https://projects.cristian-nichifor.com/legislation-linter/">Deschide aplicația</a></p>
    </main>
  </body>
</html>
